server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing: every unknown path is a React Router route, not a
    # missing file. Without this, a hard refresh on /finance/journal-entries —
    # or any bookmarked deep link — returns nginx's own 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable by construction: a change to the
    # contents produces a different filename, so these can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html must NOT be cached. It is the file that names the current
    # hashed bundles, so a stale copy pins browsers to a deployment that no
    # longer exists — the classic "users are on last week's build and one hard
    # refresh fixes it" bug.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
